[build-system]
requires = ["briefcase"]
build-backend = "briefcase.build"

[project]
name = "myapp"
version = "0.1.0"
description = "My BeeWare app"
requires-python = ">=3.8"
dependencies = ["toga"]
license = {text = "MIT"}

[tool.briefcase]
project_name = "myapp"
bundle = "com.example"
version = "0.1.0"
description = "My BeeWare app"
author = "Your Name"
author_email = "you@example.com"

[tool.briefcase.app.myapp]
formal_name = "My App"
sources = ["myapp"]