name: Build Pygame APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      run: |
        # Видаляємо старий spec, якщо є
        rm -f buildozer.spec
        
        # Створюємо новий
        buildozer init
        
        # Налаштовуємо
        sed -i 's/^requirements.*/requirements = python3,pygame/' buildozer.spec
        sed -i 's/^package.name.*/package.name = mygame/' buildozer.spec
        sed -i 's/^package.domain.*/package.domain = org.mygame/' buildozer.spec
        sed -i 's/^android.api.*/android.api = 33/' buildozer.spec
        sed -i 's/^android.minapi.*/android.minapi = 21/' buildozer.spec
        sed -i 's/^android.ndk.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/^android.sdk.*/android.sdk = 33/' buildozer.spec
        
        # Якщо є файли ресурсів - додаємо їх
        echo "source.include_exts = py,png,jpg,kv,atlas,wav,mp3,ttf" >> buildozer.spec
        
        # Запускаємо збірку
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pygame-apk
        path: bin/*.apk