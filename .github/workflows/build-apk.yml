name: Build Pygame APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip zip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev git wget
          pip install buildozer cython

      - name: Download NDK 28c
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          rm android-ndk-r28c-linux.zip

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = My Game
          package.name = mygame
          package.domain = org.mygame
          source.dir = .
          version = 0.1
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1
          android.api = 30
          android.minapi = 21
          android.ndk = 28c
          android.sdk = 30

          [buildozer]
          log_level = 2
          EOF

      - name: Build APK
        run: |
          export ANDROIDNDK=~/.buildozer/android/platform/android-ndk-r28c
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pygame-apk
          path: bin/*.apk