name: Build Pygame APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk unzip zip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
[app]
title = My Pygame Game
package.name = mygame
package.domain = org.mygame
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3,ogg
version = 0.1
requirements = python3,pygame
orientation = landscape
osx.python_version = 3
osx.kivy_version = 2.1.0
fullscreen = 1

# Android
android.api = 33
android.minapi = 21
android.ndk = 25b
android.sdk = 33
android.entrypoint = org.kivy.android.PythonActivity
android.permissions = INTERNET
android.gradle_dependencies =
android.add_src =

# iOS
ios.kivy_ios_version = 2021.1
ios.ios_deployment_target = 13.0

[buildozer]
log_level = 2
warn_on_root = 1
EOF

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pygame-apk
        path: bin/*.apk
