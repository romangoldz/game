name: Build APK with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install all dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv \
            openjdk-17-jdk unzip zip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            git wget
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest
          
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME < /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" --sdk_root=$ANDROID_HOME < /dev/null
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          cd /root/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          rm android-ndk-r28c-linux.zip
          echo "ANDROIDNDK=/root/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = My Game
          package.name = mygame
          package.domain = org.mygame
          source.dir = .
          version = 0.1
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1
          android.api = 30
          android.minapi = 21
          android.ndk = 28c
          android.sdk = 30

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=/root/.buildozer/android/platform/android-ndk-r28c
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          export PATH=$ANDROID_HOME/build-tools/30.0.3:$PATH
          
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pygame-apk
          path: bin/*.apk