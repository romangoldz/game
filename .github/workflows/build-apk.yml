name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: docker://kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found in repo root"
            exit 1
          fi

      - name: Show Python & Buildozer version
        run: |
          python --version || true
          buildozer --version || true

      - name: Build .apk (debug)
        run: |
          # Якщо потрібно - очистити попередні артефакти
          rm -rf .buildozer bin || true
          # Головна команда збірки
          buildozer -v android debug
        # Приблизні змінні середовища, якщо образ їх очікує / ви хочете перевизначити
        env:
          ANDROIDSDK: /opt/android-sdk
          ANDROIDNDK: /opt/android-ndk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk