name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: docker://kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure buildozer.spec exists (generate if missing)
        env:
          TITLE: "${{ env.TITLE }}"
          PACKAGE_NAME: "${{ env.PACKAGE_NAME }}"
          PACKAGE_DOMAIN: "${{ env.PACKAGE_DOMAIN }}"
          REQUIREMENTS: "${{ env.REQUIREMENTS }}"
          SOURCE_MAIN: "${{ env.SOURCE_MAIN }}"
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "buildozer.spec not found — generating a minimal one"
            cat > buildozer.spec <<EOF
[app]
# (replace/override with env variables in workflow if needed)
title = ${TITLE:-MyApp}
package.name = ${PACKAGE_NAME:-myapp}
package.domain = ${PACKAGE_DOMAIN:-org.test}
source.dir = .
source.main = ${SOURCE_MAIN:-main.py}
version = 0.1

requirements = ${REQUIREMENTS:-python3,kivy}

orientation = portrait
# Android settings (tune as needed)
android.api = 33
android.arch = armeabi-v7a, arm64-v8a
# android.ndk = 25b
# p4a.branch = stable
EOF
          else
            echo "buildozer.spec found"
          fi

      - name: Show buildozer.spec
        run: sed -n '1,200p' buildozer.spec || true

      - name: Build .apk (debug)
        run: |
          rm -rf .buildozer bin || true
          buildozer -v android debug
        env:
          ANDROIDSDK: /opt/android-sdk
          ANDROIDNDK: /opt/android-ndk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk