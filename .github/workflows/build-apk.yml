name: Build APK with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = My Game
          package.name = mygame
          package.domain = org.mygame
          source.dir = .
          version = 0.1
          requirements = python3,pygame
          android.api = 30
          android.minapi = 21
          android.ndk = 23b
          android.sdk = 30
          fullscreen = 1
          orientation = landscape
          EOF

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pygame-apk
          path: bin/*.apk